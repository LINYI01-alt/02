async function knowledge(){let d=await get("knowledge_sources","id,title,organization,source_url,topic,evidence_type,checked_at,notes");$("content").innerHTML=shell("医学知识库与核验清单","记录指南、学会共识、政府机构资料与证据核验日期；AI 生成内容不等于医学审核。",'<button id="addKnowledge" class="btn">＋ 添加医学来源</button><div class="panel">'+table(["来源","机构","主题","证据类型","核验日期","链接"],d.map(x=>[esc(x.title),esc(x.organization),esc(x.topic),esc(x.evidence_type),esc(x.checked_at),x.source_url?'<a href="'+esc(x.source_url)+'" target="_blank" rel="noopener">查看 ↗</a>':"—"]))+'</div><div class="notice">建议优先核验国家卫生健康委、中华医学会及相关分会、WHO、ASRM、ESHRE、ACOG 等机构的现行指南；记录发布日期、适用人群和证据等级。请勿将单篇研究直接表述为确定结论。</div>');$("addKnowledge").onclick=()=>editor("添加医学知识来源",[f("资料标题","ktitle","text",""),f("发布机构","korg","text",""),f("资料链接","kurl","url",""),f("主题","ktopic","text",""),f("证据类型 / 指南版本","ktype","text","指南 / 共识 / 系统综述 / 原始研究"),f("核验日期","kdate","text",new Date().toISOString().slice(0,10)),f("适用范围与核验备注","knote","textarea","",true)],async()=>{let q=await db.from("knowledge_sources").insert({user_id:user.id,title:$("ktitle").value,organization:$("korg").value,source_url:$("kurl").value||null,topic:$("ktopic").value,evidence_type:$("ktype").value,checked_at:$("kdate").value||null,notes:$("knote").value});if(q.error)throw q.error})}

async function douyin(){$("content").innerHTML=shell("抖音账号授权接入","通过抖音官方 OAuth 授权，不收集抖音密码",'<div class="panel"><h3>第一步：注册抖音开放平台开发者</h3><p class="muted">创建网站应用并提交审核。个人开发者可选择“自研开发者”，按平台要求完善主体与应用信息。</p><p><a href="https://open.douyin.com/" target="_blank" rel="noopener" style="color:#65d9e8">打开抖音开放平台 ↗</a></p><h3>第二步：配置网站应用</h3><p class="muted">在网站应用设置中填写授权回调地址，并申请需要的接口权限。当前预留的回调地址：</p><code style="display:block;overflow-wrap:anywhere;padding:10px;background:#0a1525;border-radius:8px">https://tomlqevtbwhoduvuujsu.supabase.co/functions/v1/douyin-oauth</code><button class="btn secondary small" id="copyCallback">复制回调地址</button><h3 style="margin-top:20px">第三步：服务器密钥配置</h3><p class="muted">将 Client Key、Client Secret 和 32 字节 Token 加密密钥配置到 Supabase Edge Function Secrets。不要把 Client Secret 或抖音密码发到聊天，也不要放入网页代码。</p><p><a href="https://supabase.com/dashboard/project/tomlqevtbwhoduvuujsu/functions/secrets" target="_blank" rel="noopener" style="color:#65d9e8">打开 Supabase Secrets 设置 ↗</a></p><button class="btn" id="startDouyin">检查配置并发起抖音授权</button><div id="douyinResult" class="notice">目前尚未完成开放平台开发者注册和网站应用凭证配置。点击按钮可检查服务端配置状态。</div></div><div class="panel"><h3>权限边界</h3><ul class="muted"><li>抖音基础登录授权不等于已获得作品数据、评论管理或发布权限。</li><li>视频发布、互动管理等能力需要在应用详情中申请并通过审核。</li><li>仅使用平台正式开放的接口，不读取 App 私人观看历史，不绕过平台限制。</li></ul></div>');$("copyCallback").onclick=()=>GenUI.copy("https://tomlqevtbwhoduvuujsu.supabase.co/functions/v1/douyin-oauth");$("startDouyin").onclick=async()=>{let b=$("startDouyin");b.disabled=true;try{let {data,error}=await db.functions.invoke("douyin-oauth",{body:{action:"start"}});if(error)throw error;if(data.authorization_url)location.href=data.authorization_url;else $("douyinResult").textContent=data.error||"暂时无法发起授权"}catch(e){$("douyinResult").textContent="暂未就绪："+(e.message||e)+"。请先完成开放平台注册和服务端密钥配置。"}finally{b.disabled=false}}}
document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>load(b.dataset.page));$("content").addEventListener("click",e=>{let b=e.target.closest("[data-go]");if(b)load(b.dataset.go)});$("login").onclick=async()=>{let r=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(r.error)$("authmsg").textContent=r.error.message;else show(r.data.user)};$("signup").onclick=async()=>{if($("password").value.length<8){$("authmsg").textContent="密码至少 8 位";return}let r=await db.auth.signUp({email:$("email").value.trim(),password:$("password").value});if(r.error)$("authmsg").textContent=r.error.message;else $("authmsg").textContent="注册已提交，请查收验证邮件后登录。"};$("logout").onclick=async()=>{await db.auth.signOut();user=null;authView("已退出")};db.auth.getSession().then(r=>r.data.session?show(r.data.session.user):authView(""));db.auth.onAuthStateChange((e,s)=>{if(s&&!user)show(s.user);if(!s&&user){user=null;authView("")}});
})();
