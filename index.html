      setStatus("画面抽帧审核完成；请按报告进行人工复核。");

async function antiRestriction(){
  const [videoRes,metricRes,riskRes]=await Promise.all([
    db.from("videos").select("id,source_video_id,title,author_name,video_url,content_category,description,published_at,created_at").order("created_at",{ascending:false}).limit(500),
    db.from("video_metrics").select("id,video_id,view_count,like_count,comment_count,share_count,favorite_count,completion_rate,two_second_exit_rate,traffic_incentive,data_source,recognition_status,captured_at").order("captured_at",{ascending:false}).limit(1500),
    db.from("content_risk_reviews").select("id,content_title,risk_score,risk_level,decision,summary,created_at,script_id").order("created_at",{ascending:false}).limit(100)
  ]);
  for(const r of [videoRes,metricRes,riskRes])if(r.error)throw r.error;
  const vids=videoRes.data||[],metrics=metricRes.data||[],risks=riskRes.data||[];
  const byVideo=new Map(),latest=new Map();
  for(const m of metrics){if(!byVideo.has(m.video_id))byVideo.set(m.video_id,[]);byVideo.get(m.video_id).push(m);if(!latest.has(m.video_id))latest.set(m.video_id,m)}
  const latestRows=[...latest.values()],fmt=n=>n==null?"—":Number(n).toLocaleString("zh-CN"),pct=n=>n==null?"—":Number(n).toFixed(1)+"%";
  const values=latestRows.map(x=>Number(x.view_count)).filter(Number.isFinite).sort((a,b)=>a-b);
  const median=values.length?values[Math.floor(values.length/2)]:null;
  const totalViews=latestRows.reduce((n,x)=>n+(Number(x.view_count)||0),0);
  const totalLikes=latestRows.reduce((n,x)=>n+(Number(x.like_count)||0),0);
  const totalComments=latestRows.reduce((n,x)=>n+(Number(x.comment_count)||0),0);
  const totalShares=latestRows.reduce((n,x)=>n+(Number(x.share_count)||0),0);
  const totalFavorites=latestRows.reduce((n,x)=>n+(Number(x.favorite_count)||0),0);
  const interactions=totalLikes+totalComments+totalShares+totalFavorites;
  const interactionRate=totalViews?interactions/totalViews*100:null;
  const now=Date.now(),stale=latestRows.filter(x=>x.captured_at&&now-new Date(x.captured_at).getTime()>7*86400000).length;
  const anomalies=[];
  for(const v of vids){
    const hs=byVideo.get(v.id)||[],m=hs[0];
    if(!m)continue;
    const age=now-new Date(m.captured_at).getTime();
    if(age>7*86400000)anomalies.push({type:"数据过期",level:"待核实",title:v.title||"未命名作品",reason:"最近一次数据快照距今超过 7 天，暂时无法判断当前表现。",action:"进入数据分析补录最新创作者中心数据。"});
    if(hs.length>1){
      const prev=hs[1],gap=new Date(m.captured_at).getTime()-new Date(prev.captured_at).getTime();
      if(gap>=24*3600000&&Number(m.view_count||0)<=Number(prev.view_count||0)+1)
        anomalies.push({type:"快照增长停滞",level:"需关注",title:v.title||"未命名作品",reason:"相隔至少 24 小时的两次快照播放计数几乎没有增长；需核实数据口径、作品状态及采集时间。",action:"核对作品是否可见，并补录一条最新数据。"});
    }
    if(median!==null&&values.length>=5&&Number(m.view_count||0)<median*0.2)
      anomalies.push({type:"相对表现偏低",level:"需关注",title:v.title||"未命名作品",reason:"该作品最新播放量低于当前作品样本中位数的 20%。这是相对表现信号，不代表账号被限流。",action:"检查选题、封面标题、发布时间、前几秒留存和内容合规。"});
  }
  const highRisks=risks.filter(x=>Number(x.risk_score)>=60||["high","高","critical"].includes(String(x.risk_level||"").toLowerCase())||x.decision==="blocked");
  const mediumRisks=risks.filter(x=>!highRisks.includes(x)&&(Number(x.risk_score)>=25||["medium","中"].includes(String(x.risk_level||"").toLowerCase())));
  let connection={connected:false,configured:false,missing:[],error:""};
  try{const q=await db.functions.invoke("douyin-oauth",{body:{action:"status"}});if(q.error)throw q.error;connection={...connection,...(q.data||{})}}catch(e){connection.error=e.message||String(e)}
  const statusLabel=connection.connected?"已连接抖音授权":connection.configured?"尚未连接抖音账号":"授权服务待配置";
  const accountCard=connection.connected
    ?'<div class="notice">已连接账号：<b>'+esc(connection.connection?.display_name||"授权账号")+'</b> · 当前授权 Scope：'+esc((connection.connection?.scopes||[]).join("、")||"未返回")+'。授权成功不等于已获得作品数据、推荐数据或账号处罚信息权限。</div>'
    :'<div class="notice">'+esc(statusLabel)+'。'+(connection.error?"状态读取说明："+esc(connection.error):"请完成开放平台应用审核和服务端密钥配置。")+'<button class="btn secondary small" data-go="douyin" style="margin-left:8px">前往账号授权</button></div>';
  const anomalyRows=anomalies.slice(0,30).map(x=>[esc(x.level),esc(x.type),esc(x.title),esc(x.reason),esc(x.action)]);
  const riskRows=risks.slice(0,15).map(x=>[esc(x.content_title||"未命名内容"),fmt(x.risk_score),esc(x.risk_level||"未标级"),esc(x.decision||"待复核"),date(x.created_at),esc(x.summary||"")]);
  const stat=(label,value,hint)=>'<div class="stat"><div class="label">'+label+'</div><div class="num">'+value+'</div><div class="hint">'+hint+'</div></div>';
  const reportText=[
    "反封控诊断报告",
    "生成时间："+new Date().toLocaleString("zh-CN"),
    "账号授权："+statusLabel,
    "作品档案："+vids.length+" 条；有数据快照："+latest.size+" 条",
    "最新快照播放量合计："+fmt(totalViews),
    "互动率："+pct(interactionRate),
    "诊断异常："+anomalies.length+" 条",
    "高风险内容风控记录："+highRisks.length+" 条；中风险："+mediumRisks.length+" 条",
    "",
    "异常明细：",
    ...anomalies.map((x,i)=>(i+1)+". ["+x.level+"] "+x.type+"｜"+x.title+"｜"+x.reason+"｜建议："+x.action),
    "",
    "说明：本报告基于工作台已保存的数据与AI内容风控记录生成，不是抖音官方账号处罚/限流结论。"
  ].join("\n");
  $("content").innerHTML=shell("反封控诊断中心","综合账号授权状态、作品历史快照和内容风控记录，识别运营异常并跟踪整改。系统只报告可见证据，不将流量波动直接判定为封控。",
    '<div class="panel"><div class="panelhead"><h3>账号连接与官方状态核验</h3><span class="pill">'+esc(statusLabel)+'</span></div>'+accountCard+
    '<div class="actions"><button class="btn secondary" id="refreshAnti">重新检查账号连接</button><a class="btn secondary" href="https://www.douyin.com/" target="_blank" rel="noopener">打开抖音核验官方通知 ↗</a></div>'+
    '<p class="muted">抖音创作者中心的账号检测、违规通知、作品审核状态和权限限制，应以账号内官方页面及系统通知为准。本工作台不会伪造官方账号健康分或内部推荐权重。</p></div>'+
    '<div class="grid">'+stat("作品档案",vids.length,"工作台已录入作品")+
    stat("有数据快照",latest.size,"至少保存过一条作品指标")+
    stat("最新快照播放量",fmt(totalViews),"各作品最新快照合计，不等于实时账号总播放")+
    stat("互动率",pct(interactionRate),"赞评分享收藏 ÷ 最新快照播放")+
    stat("异常线索",anomalies.length,"需逐项核实，不等于封控")+
    stat("高风险风控记录",highRisks.length,"来自已保存的文本 AI 风控报告")+
    stat("中风险风控记录",mediumRisks.length,"建议人工复核")+
    stat("超过7天未更新",stale,"需要补录数据的作品快照")+'</div>'+
    '<div class="panel"><div class="panelhead"><h3>一、流量与作品异常识别</h3><button class="btn secondary small" id="copyAntiReport">复制诊断报告</button></div><div class="notice">识别口径：相对表现偏低是作品间比较；快照增长停滞需要有间隔至少24小时的两条记录；数据过期只代表证据不足。单项异常都不能单独证明平台限流。</div>'+
    table(["等级","异常类型","作品","证据与原因","建议动作"],anomalyRows)+'</div>'+
    '<div class="panel"><div class="panelhead"><h3>二、内容违规风险关联</h3><button class="btn secondary small" data-go="risk">打开作品违规分析</button></div><div class="grid">'+stat("风控报告",risks.length,"已保存的内容风险记录")+stat("高风险",highRisks.length,"需优先人工复核")+stat("中风险",mediumRisks.length,"需结合语境判断")+'</div>'+
    '<p class="muted">重点检查医疗广告、试管婴儿与辅助生殖、代孕推广/撮合/交易、患者隐私、虚假承诺、站外导流等场景。正常 IVF 医学科普与违规商业推广应区别判断；政策法规科普也不能只凭关键词定性。</p>'+

    '<div class="actions"><button class="btn" data-go="metrics">补录作品数据</button><button class="btn secondary" data-go="videos">查看作品管理</button><button class="btn secondary" data-go="risk">进行内容风控检查</button><button class="btn secondary" data-go="douyin">管理账号授权</button></div></div>'+
    '<div class="panel"><h3>四、诊断能力边界与数据来源</h3><ul class="muted"><li><b>官方数据：</b>只有在抖音授权接口实际返回且权限获批时才标记为官方接口数据。</li><li><b>工作台数据：</b>作品档案、人工录入/截图识别的数据快照及保存的风控报告。</li><li><b>AI/规则推断：</b>相对表现、快照变化和内容风险提示，均需结合上下文人工核实。</li><li><b>暂不可直接读取：</b>抖音内部推荐权重、隐性限流标记、未开放的账号健康分、私信和全部评论数据。</li><li><b>不提供绕过审核或规避平台治理的操作；</b>系统只辅助发现问题、合规整改、官方申诉和恢复跟踪。</li></ul></div>');
  $("refreshAnti").onclick=()=>antiRestriction().catch(e=>toast("刷新失败："+(e.message||e)));

  $("content").innerHTML=shell("抖音账号授权接入","采用抖音开放平台 OAuth 2.0 授权码模式。用户在抖音确认后，服务器接收回调、换取令牌并加密保存；网页不接触 Client Secret 或令牌。",
  '<div class="panel"><div class="panelhead"><h3>账号连接状态</h3><span id="dyStatusPill" class="pill">正在检查…</span></div><div id="dyStatusBody" class="muted">正在读取服务端授权配置和当前账号连接记录…</div><div class="actions" style="margin-top:14px"><button class="btn" id="startDouyin">连接 / 重新授权抖音账号</button><button class="btn secondary" id="refreshDouyin">刷新授权令牌</button><button class="btn secondary" id="checkDouyin">刷新连接状态</button></div><div id="douyinResult" class="notice" style="margin-top:12px">首次连接需要先完成开放平台应用审核和服务端密钥配置。</div></div>'+
  '<div class="panel"><h3>一、抖音开放平台网站应用</h3><p class="muted">进入抖音开放平台，创建并审核通过「网站应用」，在应用信息中获取 Client Key、Client Secret。网站应用需配置下面这个完整授权回调地址，域名和路径必须与服务器一致。</p><p><a href="https://open.douyin.com/" target="_blank" rel="noopener" style="color:#65d9e8">打开抖音开放平台 ↗</a></p><code style="display:block;overflow-wrap:anywhere;padding:10px;background:#0a1525;border-radius:8px">'+callback+'</code><button class="btn secondary small" id="copyCallback">复制授权回调地址</button></div>'+
  '<div class="panel"><h3>二、Supabase 服务端密钥</h3><p class="muted">将以下变量设置在 Supabase Edge Function Secrets（只放服务器，绝不能写进 index.html）。DOUYIN_TOKEN_ENCRYPTION_KEY 需为随机生成的 32 字节密钥再做 Base64 编码。</p><ul class="muted"><li><code>DOUYIN_CLIENT_KEY</code>：抖音网站应用 Client Key</li><li><code>DOUYIN_CLIENT_SECRET</code>：抖音网站应用 Client Secret</li><li><code>DOUYIN_TOKEN_ENCRYPTION_KEY</code>：32 字节随机 Base64 密钥</li><li><code>DOUYIN_REDIRECT_URI</code>：上方完整回调地址</li><li><code>DOUYIN_APP_URL</code>：https://linyi01-alt.github.io/02/</li><li><code>DOUYIN_SCOPES</code>：默认 <code>user_info</code>；只有开放平台已批准相应权限后才添加其他 scope</li></ul><p><a href="https://supabase.com/dashboard/project/tomlqevtbwhoduvuujsu/functions/secrets" target="_blank" rel="noopener" style="color:#65d9e8">打开 Supabase Edge Function Secrets ↗</a></p></div>'+
  '<div class="panel"><h3>三、授权后的工作流程</h3><ol class="muted"><li>本工作台登录管理员身份后发起授权，生成一次性 state。</li><li>抖音展示扫码 / 登录授权页，由账号持有人确认权限。</li><li>抖音携带 code 回调到 Supabase，服务器校验 state 并换取 access_token / refresh_token。</li><li>服务器尝试获取昵称与头像资料，并将账号标识、scope 和令牌加密存入 private 数据表。</li><li>授权完成页可返回本工作台；授权状态卡片显示已连接及令牌期限。</li></ol></div>'+
  '<div class="panel"><h3>四、权限与有效期说明</h3><p class="muted">当前默认申请 <code>user_info</code>，用于账号公开资料。作品列表、数据分析、评论管理、视频发布等必须按实际业务在开放平台单独申请 scope 并通过审核，不能因登录成功就视为已具备。</p><p class="muted">抖音文档说明 access_token 通常有效期 15 天、refresh_token 通常 30 天；本系统提供服务端刷新入口。若用户撤销授权或 refresh_token 过期，需要重新授权。</p><p><a href="https://open.douyin.com/platform/resource/docs/develop/permission/web/oauth2" target="_blank" rel="noopener" style="color:#65d9e8">抖音网站应用 OAuth 2.0 官方说明 ↗</a> · <a href="https://open.douyin.com/platform/resource/docs/accession-guide/type-and-permission/" target="_blank" rel="noopener" style="color:#65d9e8">授权权限目录 ↗</a></p></div>');
  $("copyCallback").onclick=()=>GenUI.copy(callback);
  async function status(){
    const pill=$("dyStatusPill"),body=$("dyStatusBody"),start=$("startDouyin"),refresh=$("refreshDouyin");
    pill.textContent="正在检查…";start.disabled=true;refresh.disabled=true;
    try{
      const {data,error}=await db.functions.invoke("douyin-oauth",{body:{action:"status"}});
      if(error)throw error;
      const c=data.connection||{},missing=data.missing||[];
      if(c.connected){
        pill.textContent="抖音账号已连接";pill.style.color="#25f4ee";
        body.innerHTML='<div class="grid">'+
          '<div class="stat"><div class="label">授权账号</div><div class="num" style="font-size:18px">'+esc(c.display_name||"已授权账号")+'</div><div class="hint">昵称来自抖音公开信息接口（若已返回）</div></div>'+
          '<div class="stat"><div class="label">Open ID</div><div class="num" style="font-size:13px;overflow-wrap:anywhere">'+esc(c.open_id||"已连接")+'</div><div class="hint">当前应用下的账号标识</div></div>'+
          '<div class="stat"><div class="label">Access Token 到期</div><div class="num" style="font-size:14px">'+(c.access_token_expires_at?date(c.access_token_expires_at):"平台未返回期限")+'</div><div class="hint">令牌仅保存在服务端</div></div>'+
          '<div class="stat"><div class="label">Refresh Token 到期</div><div class="num" style="font-size:14px">'+(c.refresh_token_expires_at?date(c.refresh_token_expires_at):"平台未返回期限")+'</div><div class="hint">过期后需重新授权</div></div></div>'+
          '<p class="muted">已授权 Scope：'+esc((c.scopes||[]).join("、")||"未返回")+'</p><p class="muted">连接时间：'+esc(c.connected_at?date(c.connected_at):"—")+'</p>';
        refresh.disabled=false;
      }else{
        pill.textContent="尚未连接";pill.style.color="#f5c26b";
        body.innerHTML='<p>当前账号尚未建立抖音授权连接。</p>';
      }
      if(data.configured){start.disabled=false}else{
        start.disabled=true;
        body.innerHTML+='<div class="notice">服务端尚未配置完整，缺少：'+esc(missing.join("、")||"请检查服务端环境变量")+'。完成配置后可点击“刷新连接状态”。</div>';
      }
    }catch(e){pill.textContent="状态读取失败";body.textContent="无法读取服务端状态："+(e.message||e);start.disabled=true}
  }
  $("checkDouyin").onclick=status;
  $("startDouyin").onclick=async()=>{const b=$("startDouyin"),msg=$("douyinResult");b.disabled=true;msg.textContent="正在创建安全授权请求…";try{const {data,error}=await db.functions.invoke("douyin-oauth",{body:{action:"start"}});if(error)throw error;if(data.authorization_url)location.href=data.authorization_url;else throw Error(data.error||"无法发起授权")}catch(e){msg.textContent="暂时无法发起授权："+(e.message||e)+"。请先完成上方服务端密钥配置及抖音回调域名配置。";b.disabled=false}};
  $("refreshDouyin").onclick=async()=>{const b=$("refreshDouyin"),msg=$("douyinResult");b.disabled=true;msg.textContent="正在通过服务端刷新抖音授权令牌…";try{const {data,error}=await db.functions.invoke("douyin-oauth",{body:{action:"refresh"}});if(error)throw error;if(!data.ok)throw Error(data.error||"刷新失败");msg.textContent=data.message||"令牌刷新成功";await status()}catch(e){msg.textContent="令牌刷新失败："+(e.message||e)+"。如果 refresh_token 已过期或授权已撤销，请重新授权。"}finally{b.disabled=false}};
  await status();
}
window.__douyinRadarReady=true;document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>load(b.dataset.page));$("content").addEventListener("click",e=>{let b=e.target.closest("[data-go]");if(b)load(b.dataset.go)});$("login").onclick=async()=>{const b=$("login"),msg=$("authmsg"),email=$("email").value.trim(),password=$("password").value;if(b.disabled)return;if(!email||!password){msg.textContent="请先填写邮箱和密码";return}b.disabled=true;b.textContent="正在登录…";msg.textContent="正在连接认证服务，请稍候…";let timer;try{const result=await Promise.race([db.auth.signInWithPassword({email,password}),new Promise((_,reject)=>{timer=setTimeout(()=>reject(new Error("登录请求超时（15秒）。请检查网络或稍后重试。")),15000)})]);clearTimeout(timer);if(result.error)throw result.error;if(!result.data?.user)throw new Error("认证服务未返回用户信息，请重试");msg.textContent="登录成功，正在验证管理员权限…";await show(result.data.user)}catch(e){clearTimeout(timer);msg.textContent="登录失败："+(e?.message||String(e));}finally{b.disabled=false;b.textContent="登录"}};$("signup").onclick=()=>{$("authmsg").textContent="此工作台仅限指定管理员登录，不开放注册。"};$("logout").onclick=async()=>{await db.auth.signOut();user=null;authView("已退出")};db.auth.getSession().then(r=>r.data.session?show(r.data.session.user):authView(""));db.auth.onAuthStateChange((e,s)=>{if(s&&!user)show(s.user);if(!s&&user){user=null;authView("")}});
}})();
</script></body></html>
