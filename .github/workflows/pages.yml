name: Publish static admin
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check inline JavaScript syntax
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>", html, re.I)
          inline = [s for s in scripts if s.strip()]
          if not inline:
              raise SystemExit("No inline scripts found")
          for i, script in enumerate(inline, 1):
              Path(f"/tmp/inline-{i}.js").write_text(script, encoding="utf-8")
          print(f"Checking {len(inline)} inline scripts")
          PY
          for file in /tmp/inline-*.js; do node --check "$file"; done
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages
      - id: deployment
        uses: actions/deploy-pages@v4

